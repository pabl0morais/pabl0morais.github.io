  <title>Treino Interativo - II SPELLING BEE / DELETRE / SOLETRANDO 2026</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>

    body { font-family: 'Poppins', sans-serif; }
    .pulse-animation {
      animation: pulse 1.5s infinite;
    }
    @keyframes pulse {
      0% { transform: scale(1); }
      50% { transform: scale(1.03); }
      100% { transform: scale(1); }
    }
  </style>

<body class="bg-slate-900 text-slate-100 min-h-screen flex flex-col justify-between select-none">

  <!-- Header -->

    <div class="max-w-4xl mx-auto flex flex-col sm:flex-row justify-between items-center gap-3">
      <div class="flex items-center space-x-3 text-center sm:text-left">
        <div class="bg-amber-500 text-slate-900 p-2 sm:p-3 rounded-xl text-lg sm:text-xl font-bold flex-shrink-0">
          <i class="fa-solid fa-graduation-cap"></i>
        </div>
        <div>
          <h1 class="font-bold text-sm sm:text-lg leading-tight">II SPELLING BEE / DELETRE / SOLETRANDO</h1>

        </div>
      </div>
      
      <!-- Idioma Filtros - Scroll horizontal no mobile caso precise -->
      <div class="flex w-full sm:w-auto justify-center gap-1 sm:gap-1.5 overflow-x-auto pb-1 sm:pb-0">
        <button id="langFilterAll" onclick="setLanguageFilter('all')" class="px-2.5 py-1.5 text-xs font-semibold rounded-lg bg-amber-500 text-slate-900 flex-1 sm:flex-none text-center">Todos</button>
        <button id="langFilterPt" onclick="setLanguageFilter('pt')" class="px-2 py-1.5 text-xs font-semibold rounded-lg bg-slate-700 hover:bg-slate-600 text-slate-200 flex-1 sm:flex-none text-center whitespace-nowrap">🇧🇷 PT</button>
        <button id="langFilterEn" onclick="setLanguageFilter('en')" class="px-2 py-1.5 text-xs font-semibold rounded-lg bg-slate-700 hover:bg-slate-600 text-slate-200 flex-1 sm:flex-none text-center whitespace-nowrap">🇬🇧 EN</button>
        <button id="langFilterEs" onclick="setLanguageFilter('es')" class="px-2 py-1.5 text-xs font-semibold rounded-lg bg-slate-700 hover:bg-slate-600 text-slate-200 flex-1 sm:flex-none text-center whitespace-nowrap">🇪🇸 ES</button>
      </div>
    </div>
  </header>

  <!-- Main Container -->
  <main class="flex-1 max-w-4xl w-full mx-auto p-3 sm:p-4 flex flex-col justify-between">
    
    <!-- Scoreboard -->
    <div class="grid grid-cols-3 gap-2 sm:gap-3 mb-3 sm:mb-4">
      <div class="bg-slate-800/80 border border-slate-700 rounded-xl p-2 sm:p-3 text-center">
        <span class="text-[10px] sm:text-xs text-slate-400 block uppercase font-semibold">Acertos</span>
        <span id="scoreCorrect" class="text-xl sm:text-2xl font-bold text-emerald-400">0</span>
      </div>
      <div class="bg-slate-800/80 border border-slate-700 rounded-xl p-2 sm:p-3 text-center">
        <span class="text-[10px] sm:text-xs text-slate-400 block uppercase font-semibold">Erros</span>
        <span id="scoreIncorrect" class="text-xl sm:text-2xl font-bold text-rose-400">0</span>
      </div>
      <div class="bg-slate-800/80 border border-slate-700 rounded-xl p-2 sm:p-3 text-center">
        <span class="text-[10px] sm:text-xs text-slate-400 block uppercase font-semibold">Restantes</span>
        <span id="wordsRemaining" class="text-xl sm:text-2xl font-bold text-amber-400">0</span>
      </div>
    </div>

    <!-- Main Card -->
    <div class="bg-slate-800 border border-slate-700 rounded-2xl p-4 sm:p-6 shadow-2xl flex-1 flex flex-col justify-between mb-2 sm:mb-4">
      
      <div>
        <div class="flex justify-between items-center mb-4">
          <span id="wordLanguageBadge" class="px-2.5 py-1 rounded-full text-[10px] sm:text-xs font-bold tracking-wider uppercase bg-blue-500/20 text-blue-400 border border-blue-500/30">
            INGLÊS
          </span>
          <span class="text-xs text-slate-400">Palavra <span id="currentWordIndex">1</span> de <span id="totalWordCount">0</span></span>
        </div>

        <div class="text-center my-2 sm:my-4">
          <button onclick="speakWord(true)" class="w-full sm:w-auto bg-amber-500 active:bg-amber-600 hover:bg-amber-400 text-slate-900 font-bold px-5 py-3.5 sm:px-6 sm:py-4 rounded-full text-base sm:text-lg shadow-lg transition-all flex items-center justify-center gap-2 sm:gap-3 mx-auto pulse-animation touch-manipulation">
            <i class="fa-solid fa-volume-high text-lg sm:text-xl"></i>
            <span>OUVIR PALAVRA (2x)</span>
          </button>
          <p class="text-[11px] sm:text-xs text-slate-400 mt-2">Toque para ouvir a banca pronunciar a palavra.</p>
        </div>

        <!-- Help Actions -->
        <div class="grid grid-cols-1 sm:grid-cols-2 gap-2 sm:gap-3 mt-4">
          <button onclick="toggleContextSentence()" id="btnSentence" class="bg-slate-700/60 active:bg-slate-600 hover:bg-slate-700 text-slate-200 p-2.5 sm:p-3 rounded-xl text-xs font-semibold flex items-center justify-center gap-2 border border-slate-600 transition touch-manipulation">
            <i class="fa-solid fa-quote-left text-amber-400"></i>
            <span>Solicitar Frase no Contexto</span>
          </button>
          <button onclick="toggleDefinition()" id="btnDefinition" class="bg-slate-700/60 active:bg-slate-600 hover:bg-slate-700 text-slate-200 p-2.5 sm:p-3 rounded-xl text-xs font-semibold flex items-center justify-center gap-2 border border-slate-600 transition touch-manipulation">
            <i class="fa-solid fa-book-open text-amber-400"></i>
            <span>Solicitar Definição</span>
          </button>
        </div>

        <!-- Context/Definition Display -->
        <div id="infoDisplayBox" class="mt-3 p-3 sm:p-4 bg-slate-900/60 border border-slate-700 rounded-xl text-xs sm:text-sm min-h-[50px] hidden transition-all">
          <p id="infoDisplayText" class="text-slate-300 italic"></p>
        </div>
      </div>

      <!-- User Spelling Input Section -->
      <div class="mt-6 sm:mt-8">
        <label class="block text-[10px] sm:text-xs font-medium text-slate-400 mb-1.5 uppercase tracking-wider text-center">
          Digite para soletrar (Cada letra será falada em voz alta)
        </label>

        <div class="relative">
          <input 
            type="text" 
            id="spellingInput" 
            placeholder="Digite aqui..."
            class="w-full bg-slate-900 border-2 border-slate-700 focus:border-amber-500 rounded-xl px-3 py-2.5 sm:py-3 text-center text-base sm:text-lg font-mono tracking-widest text-white uppercase outline-none transition"
            onkeypress="handleKeyPress(event)"
            autocomplete="off"
            autocorrect="off"
            autocapitalize="characters"
            spellcheck="false"
          />
        </div>

        <div class="flex gap-2 sm:gap-3 mt-3 sm:mt-4">
          <button onclick="submitSpelling()" class="flex-1 bg-emerald-600 active:bg-emerald-700 hover:bg-emerald-500 text-white font-bold py-3 rounded-xl text-xs sm:text-sm transition flex items-center justify-center gap-2 shadow-lg touch-manipulation">
            <i class="fa-solid fa-check"></i>
            <span>CONFIRMAR</span>
          </button>
          <button onclick="skipWord()" class="bg-slate-700 active:bg-slate-600 hover:bg-slate-600 text-slate-300 px-3.5 py-3 rounded-xl text-xs sm:text-sm font-semibold transition touch-manipulation">
            Pular
          </button>
        </div>
      </div>

    </div>

    <!-- Modal Feedback -->
    <div id="feedbackModal" class="fixed inset-0 bg-slate-950/85 backdrop-blur-sm flex items-center justify-center p-4 z-50 hidden">
      <div class="bg-slate-800 border border-slate-700 rounded-2xl max-w-sm w-full p-5 sm:p-6 text-center shadow-2xl">
        <div id="feedbackIcon" class="text-4xl sm:text-5xl mb-3"></div>
        <h3 id="feedbackTitle" class="text-lg sm:text-xl font-bold mb-2"></h3>
        <p id="feedbackMessage" class="text-slate-300 text-xs sm:text-sm mb-4"></p>
        <div id="correctSpellingBox" class="bg-slate-900 p-2.5 sm:p-3 rounded-xl mb-5 font-mono text-amber-400 font-bold tracking-widest text-xs sm:text-sm break-all"></div>

          Próxima Palavra <i class="fa-solid fa-arrow-right ml-1"></i>
        </button>
      </div>
    </div>

  </main>

      { word: "ZAPATERÍA", lang: "es", def: "Tienda donde se venden o reparan zapatos.", sentence: "Compramos botas nuevas en la zapatería." }
    ];

    let currentFilter = 'all';
    let filteredList = [];
    let currentIndex = 0;
    let correctCount = 0;
    let incorrectCount = 0;
    let lastRawInput = "";

    const synth = window.speechSynthesis;

    function initGame() {
      applyFilter();
      shuffleList();
      currentIndex = 0;
      correctCount = 0;
      incorrectCount = 0;
      updateScoreboard();
      loadWord();
    }

    function applyFilter() {
      if (currentFilter === 'all') {
        filteredList = [...wordsDatabase];
      } else {
        filteredList = wordsDatabase.filter(item => item.lang === currentFilter);
      }
    }

    function shuffleList() {
      for (let i = filteredList.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [filteredList[i], filteredList[j]] = [filteredList[j], filteredList[i]];
      }
    }

    function setLanguageFilter(lang) {
      currentFilter = lang;
      document.getElementById('langFilterAll').className = lang === 'all' ? 'px-2.5 py-1.5 text-xs font-semibold rounded-lg bg-amber-500 text-slate-900 flex-1 sm:flex-none text-center' : 'px-2.5 py-1.5 text-xs font-semibold rounded-lg bg-slate-700 hover:bg-slate-600 text-slate-200 flex-1 sm:flex-none text-center';
      document.getElementById('langFilterPt').className = lang === 'pt' ? 'px-2 py-1.5 text-xs font-semibold rounded-lg bg-amber-500 text-slate-900 flex-1 sm:flex-none text-center whitespace-nowrap' : 'px-2 py-1.5 text-xs font-semibold rounded-lg bg-slate-700 hover:bg-slate-600 text-slate-200 flex-1 sm:flex-none text-center whitespace-nowrap';
      document.getElementById('langFilterEn').className = lang === 'en' ? 'px-2 py-1.5 text-xs font-semibold rounded-lg bg-amber-500 text-slate-900 flex-1 sm:flex-none text-center whitespace-nowrap' : 'px-2 py-1.5 text-xs font-semibold rounded-lg bg-slate-700 hover:bg-slate-600 text-slate-200 flex-1 sm:flex-none text-center whitespace-nowrap';
      document.getElementById('langFilterEs').className = lang === 'es' ? 'px-2 py-1.5 text-xs font-semibold rounded-lg bg-amber-500 text-slate-900 flex-1 sm:flex-none text-center whitespace-nowrap' : 'px-2 py-1.5 text-xs font-semibold rounded-lg bg-slate-700 hover:bg-slate-600 text-slate-200 flex-1 sm:flex-none text-center whitespace-nowrap';
      initGame();
    }

    function loadWord() {
      if (currentIndex >= filteredList.length) {
        alert("Parabéns! Você completou toda a lista do treino!");
        initGame();
        return;
      }

      const currentItem = filteredList[currentIndex];
      
      const badge = document.getElementById('wordLanguageBadge');
      if (currentItem.lang === 'pt') {
        badge.textContent = '🇧🇷 PORTUGUÊS';
        badge.className = 'px-2.5 py-1 rounded-full text-[10px] sm:text-xs font-bold tracking-wider uppercase bg-emerald-500/20 text-emerald-400 border border-emerald-500/30';
      } else if (currentItem.lang === 'en') {
        badge.textContent = '🇬🇧 INGLÊS';
        badge.className = 'px-2.5 py-1 rounded-full text-[10px] sm:text-xs font-bold tracking-wider uppercase bg-blue-500/20 text-blue-400 border border-blue-500/30';
      } else {
        badge.textContent = '🇪🇸 ESPANHOL';
        badge.className = 'px-2.5 py-1 rounded-full text-[10px] sm:text-xs font-bold tracking-wider uppercase bg-red-500/20 text-red-400 border border-red-500/30';
      }

      document.getElementById('currentWordIndex').textContent = currentIndex + 1;
      document.getElementById('totalWordCount').textContent = filteredList.length;
      document.getElementById('spellingInput').value = '';
      lastRawInput = "";
      document.getElementById('infoDisplayBox').classList.add('hidden');

      setTimeout(() => speakWord(true), 400);
    }

    function getLangCode(lang) {
      if (lang === 'pt') return 'pt-BR';
      if (lang === 'en') return 'en-US';
      if (lang === 'es') return 'es-ES';
      return 'pt-BR';
    }

    function speakWord(twice = false) {
      if (!synth) return;
      synth.cancel();

      const item = filteredList[currentIndex];
      const utterance = new SpeechSynthesisUtterance(item.word);
      utterance.lang = getLangCode(item.lang);
      utterance.rate = 0.85;

      synth.speak(utterance);

      if (twice) {
        setTimeout(() => {
          const utterance2 = new SpeechSynthesisUtterance(item.word);
          utterance2.lang = getLangCode(item.lang);
          utterance2.rate = 0.85;
          synth.speak(utterance2);
        }, 1200);
      }
    }

    function speakLetter(letter) {
      if (!synth || !letter) return;
      synth.cancel();

      const item = filteredList[currentIndex];
      const utterance = new SpeechSynthesisUtterance(letter);
      utterance.lang = getLangCode(item.lang);
      utterance.rate = 0.9;
      synth.speak(utterance);
    }

    function toggleContextSentence() {
      const box = document.getElementById('infoDisplayBox');
      const text = document.getElementById('infoDisplayText');
      const item = filteredList[currentIndex];

      text.innerHTML = `<strong>Frase de Contexto:</strong> "${item.sentence}"`;
      box.classList.remove('hidden');

      const utterance = new SpeechSynthesisUtterance(item.sentence);
      utterance.lang = getLangCode(item.lang);
      synth.cancel();
      synth.speak(utterance);
    }

    function toggleDefinition() {
      const box = document.getElementById('infoDisplayBox');
      const text = document.getElementById('infoDisplayText');
      const item = filteredList[currentIndex];

      text.innerHTML = `<strong>Definição:</strong> ${item.def}`;
      box.classList.remove('hidden');
    }

    function cleanString(str) {
      return str.toUpperCase().replace(/[^A-ZÁÉÍÓÚÃÕÂÊÔÇÑ']/g, '');
    }

    function formatSpelling(str) {
      return cleanString(str).split('').join('-');
    }

    function submitSpelling() {
      const inputVal = document.getElementById('spellingInput').value;
      const currentItem = filteredList[currentIndex];
      
      const userClean = cleanString(inputVal);
      const targetClean = cleanString(currentItem.word);

      const modal = document.getElementById('feedbackModal');
      const icon = document.getElementById('feedbackIcon');
      const title = document.getElementById('feedbackTitle');
      const msg = document.getElementById('feedbackMessage');
      const correctBox = document.getElementById('correctSpellingBox');

      correctBox.textContent = `${currentItem.word} ➔ ${formatSpelling(currentItem.word)}`;

      if (userClean === targetClean) {
        correctCount++;
        icon.innerHTML = '🎉';
        title.textContent = 'Soletração Correta!';
        title.className = 'text-lg sm:text-xl font-bold mb-2 text-emerald-400';
        msg.textContent = 'Excelente! Você demonstrou domínio perfeito da regra de soletração da palavra.';
      } else {
        incorrectCount++;
        icon.innerHTML = '❌';
        title.textContent = 'Soletração Incorreta';
        title.className = 'text-lg sm:text-xl font-bold mb-2 text-rose-400';
        msg.textContent = `A banca informou que a resposta exata era:`;
      }

      updateScoreboard();
      modal.classList.remove('hidden');
    }

    function skipWord() {
      currentIndex++;
      loadWord();
    }

    function nextQuestion() {
      document.getElementById('feedbackModal').classList.add('hidden');
      currentIndex++;
      loadWord();
    }

    function updateScoreboard() {
      document.getElementById('scoreCorrect').textContent = correctCount;
      document.getElementById('scoreIncorrect').textContent = incorrectCount;
      document.getElementById('wordsRemaining').textContent = filteredList.length - currentIndex;
    }

    function handleKeyPress(e) {
      if (e.key === 'Enter') {
        submitSpelling();
      }
    }

    document.getElementById('spellingInput').addEventListener('input', function(e) {
      let raw = cleanString(e.target.value);
      
      if (raw.length > lastRawInput.length) {
        let addedChar = raw.charAt(raw.length - 1);
        speakLetter(addedChar);
      }

      lastRawInput = raw;

      if (raw.length > 0) {
        e.target.value = raw.split('').join('-');
      } else {
        e.target.value = '';
      }
    });

    window.onload = initGame;
  </script>
