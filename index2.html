<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Treino Interativo - II SPELLING BEE / DELETRE / SOLETRANDO 2026</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap');
    body { font-family: 'Poppins', sans-serif; }
  </style>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen flex flex-col items-center justify-center p-2 sm:p-4">

  <!-- Main Container Compacto -->
  <div class="w-full max-w-md bg-slate-800 border border-slate-700 rounded-2xl p-4 shadow-xl flex flex-col gap-3">
    
    <!-- Header -->
    <div class="flex flex-col gap-2 border-b border-slate-700 pb-3">
      <div class="flex items-center gap-2">
        <div class="bg-amber-500 text-slate-900 p-2 rounded-lg text-base font-bold">
          <i class="fa-solid fa-graduation-cap"></i>
        </div>
        <div>
          <h1 class="font-bold text-xs leading-tight">II SPELLING BEE / DELETRE / SOLETRANDO</h1>
          <p class="text-[10px] text-amber-400 font-medium">CTF / UFPI (2026)</p>
        </div>
      </div>
      
      <!-- Filtro Idiomas Compacto -->
      <div class="flex gap-1 w-full justify-between pt-1">
        <button id="langFilterAll" onclick="setLanguageFilter('all')" class="px-2 py-1 text-[10px] font-bold rounded bg-amber-500 text-slate-900 flex-1 text-center">Todos</button>
        <button id="langFilterPt" onclick="setLanguageFilter('pt')" class="px-2 py-1 text-[10px] font-bold rounded bg-slate-700 text-slate-300 flex-1 text-center">🇧🇷 PT</button>
        <button id="langFilterEn" onclick="setLanguageFilter('en')" class="px-2 py-1 text-[10px] font-bold rounded bg-slate-700 text-slate-300 flex-1 text-center">🇬🇧 EN</button>
        <button id="langFilterEs" onclick="setLanguageFilter('es')" class="px-2 py-1 text-[10px] font-bold rounded bg-slate-700 text-slate-300 flex-1 text-center">🇪🇸 ES</button>
      </div>
    </div>

    <!-- Placar Compacto -->
    <div class="grid grid-cols-3 gap-2 text-center">
      <div class="bg-slate-900/60 border border-slate-700 rounded-lg p-1.5">
        <span class="text-[9px] text-slate-400 font-bold uppercase block">Acertos</span>
        <span id="scoreCorrect" class="text-base font-bold text-emerald-400">0</span>
      </div>
      <div class="bg-slate-900/60 border border-slate-700 rounded-lg p-1.5">
        <span class="text-[9px] text-slate-400 font-bold uppercase block">Erros</span>
        <span id="scoreIncorrect" class="text-base font-bold text-rose-400">0</span>
      </div>
      <div class="bg-slate-900/60 border border-slate-700 rounded-lg p-1.5">
        <span class="text-[9px] text-slate-400 font-bold uppercase block">Restantes</span>
        <span id="wordsRemaining" class="text-base font-bold text-amber-400">0</span>
      </div>
    </div>

    <!-- Badge e Posição da Palavra -->
    <div class="flex justify-between items-center mt-1">
      <span id="wordLanguageBadge" class="px-2.5 py-0.5 rounded-full text-[10px] font-bold tracking-wider uppercase bg-blue-500/20 text-blue-400 border border-blue-500/30">
        INGLÊS
      </span>
      <span class="text-[11px] text-slate-400">Palavra <span id="currentWordIndex" class="text-white font-bold">1</span>/<span id="totalWordCount">0</span></span>
    </div>

    <!-- Botão Principal de Áudio -->
    <button onclick="speakWord(true)" class="w-full bg-amber-500 hover:bg-amber-400 text-slate-900 font-bold py-2.5 rounded-xl text-xs shadow-md transition flex items-center justify-center gap-2">
      <i class="fa-solid fa-volume-high text-sm"></i>
      <span>OUVIR PALAVRA (2x)</span>
    </button>

    <!-- Botões de Ajuda -->
    <div class="grid grid-cols-2 gap-2">
      <button onclick="toggleContextSentence()" id="btnSentence" class="bg-slate-700/60 hover:bg-slate-700 text-slate-200 py-2 px-1 rounded-lg text-[10px] font-semibold flex items-center justify-center gap-1 border border-slate-600">
        <i class="fa-solid fa-quote-left text-amber-400"></i>
        <span>Frase no Contexto</span>
      </button>
      <button onclick="toggleDefinition()" id="btnDefinition" class="bg-slate-700/60 hover:bg-slate-700 text-slate-200 py-2 px-1 rounded-lg text-[10px] font-semibold flex items-center justify-center gap-1 border border-slate-600">
        <i class="fa-solid fa-book-open text-amber-400"></i>
        <span>Definição</span>
      </button>
    </div>

    <!-- Área de Exibição de Frase/Definição -->
    <div id="infoDisplayBox" class="p-2.5 bg-slate-900 border border-slate-700 rounded-lg text-xs hidden">
      <p id="infoDisplayText" class="text-slate-300 italic"></p>
    </div>

    <!-- Campo de Entrada / Soletração -->
    <div class="mt-1 border-t border-slate-700/60 pt-3">
      <label class="block text-[10px] font-medium text-slate-400 mb-1.5 uppercase tracking-wider text-center">
        Digite para soletrar (letra por letra em voz alta)
      </label>

      <input 
        type="text" 
        id="spellingInput" 
        placeholder="DIGITE AQUI..."
        class="w-full bg-slate-900 border border-slate-700 focus:border-amber-500 rounded-xl px-3 py-2 text-center text-base font-mono tracking-widest text-white uppercase outline-none"
        onkeypress="handleKeyPress(event)"
      />

      <div class="flex gap-2 mt-3">
        <button onclick="submitSpelling()" class="flex-1 bg-emerald-600 hover:bg-emerald-500 text-white font-bold py-2 rounded-xl text-xs flex items-center justify-center gap-1.5 shadow">
          <i class="fa-solid fa-check"></i>
          <span>CONFIRMAR</span>
        </button>
        <button onclick="skipWord()" class="bg-slate-700 hover:bg-slate-600 text-slate-300 px-3 py-2 rounded-xl text-xs font-semibold">
          Pular
        </button>
      </div>
    </div>

  </div>

  <!-- Modal Feedback -->
  <div id="feedbackModal" class="fixed inset-0 bg-slate-950/80 backdrop-blur-sm flex items-center justify-center p-4 z-50 hidden">
    <div class="bg-slate-800 border border-slate-700 rounded-2xl max-w-xs w-full p-5 text-center shadow-2xl">
      <div id="feedbackIcon" class="text-4xl mb-2"></div>
      <h3 id="feedbackTitle" class="text-lg font-bold mb-1"></h3>
      <p id="feedbackMessage" class="text-slate-300 text-xs mb-3"></p>
      <div id="correctSpellingBox" class="bg-slate-900 p-2 rounded-lg mb-4 font-mono text-amber-400 text-xs font-bold tracking-widest"></div>
      <button onclick="nextQuestion()" class="w-full bg-amber-500 hover:bg-amber-400 text-slate-900 font-bold py-2 rounded-xl text-xs">
        Próxima Palavra <i class="fa-solid fa-arrow-right ml-1"></i>
      </button>
    </div>
  </div>

  <script>
    const wordsDatabase = [

      { word: "VENTANA", lang: "es", def: "Abertura en la pared que permite entrada de luz.", sentence: "Abre la ventana para que entre aire fresco." },

      { word: "MURCIÉLAGO", lang: "es", def: "Mamífero volador de hábitos nocturnos.", sentence: "El murciélago voló dentro de la cueva." },
      { word: "ENFERMERA", lang: "es", def: "Persona que cuida a los enfermos.", sentence: "La enfermera atendió al paciente con amabilidad." },
      { word: "DESARROLLAR", lang: "es", def: "Hacer que algo crezca o progrese.", sentence: "Es importante desarrollar nuevas habilidades." },
      { word: "AGUACATE", lang: "es", def: "Fruta de pulpa verde y cremosa.", sentence: "Me encanta el aguacate en la ensalada." },
      { word: "PARAGUAS", lang: "es", def: "Objeto para protegerse de la lluvia.", sentence: "Lleva un paraguas, va a llover." },
      { word: "ZANAHORIA", lang: "es", def: "Raíz comestible de color anaranjado.", sentence: "La sopa tiene zanahoria y papa." },
      { word: "OVEJA", lang: "es", def: "Animal domesticado que da lana y carne.", sentence: "En el campo hay muchas ovejas pastando." },
      { word: "DESEMPEÑAR", lang: "es", def: "Realizar una función o tarea asignada.", sentence: "Ella va a desempeñar un papel importante en la obra." },
      { word: "ANTEAYER", lang: "es", def: "Día anterior al de ayer.", sentence: "Fui al médico anteayer." },
      { word: "AJEDREZ", lang: "es", def: "Juego de estrategia sobre un tablero.", sentence: "Jugué al ajedrez con mi abuelo." },
      { word: "PAISAJE", lang: "es", def: "Terreno que se ve desde un sitio.", sentence: "El paisaje desde la cima era impresionante." },
      { word: "PANTALLA", lang: "es", def: "Superficie donde se proyectan las imágenes.", sentence: "La pantalla del televisor es grande." },
      { word: "RELOJ", lang: "es", def: "Instrumento que sirve para medir el tiempo.", sentence: "El reloj de la sala da las doce." },
      { word: "SOMBRERO", lang: "es", def: "Prenda de vestir que sirve para cubrir la cabeza del sol o frío.", sentence: "Llevaba un sombrero de paja en la playa." },
      { word: "TELÉFONO", lang: "es", def: "Aparato para transmitir voz por señales eléctricas.", sentence: "El teléfono sonó interrumpiendo el silencio." },
      { word: "TRABAJO", lang: "es", def: "Esfuerzo humano dedicado a la producción de bienes o servicios.", sentence: "Ella está muy satisfecha con su trabajo." },
      { word: "VACACIONES", lang: "es", def: "Descanso temporal de una actividad habitual como el estudio o trabajo.", sentence: "Iremos a la playa en las vacaciones de verano." },
      { word: "ZAPATERÍA", lang: "es", def: "Tienda donde se venden o reparan zapatos.", sentence: "Compramos botas nuevas en la zapatería." }
    ];

    let currentFilter = 'all';
    let filteredList = [];
    let currentIndex = 0;
    let correctCount = 0;
    let incorrectCount = 0;
    let lastRawInput = "";

    const synth = window.speechSynthesis;

    function initGame() {
      applyFilter();
      shuffleList();
      currentIndex = 0;
      correctCount = 0;
      incorrectCount = 0;
      updateScoreboard();
      loadWord();
    }

    function applyFilter() {
      if (currentFilter === 'all') {
        filteredList = [...wordsDatabase];
      } else {
        filteredList = wordsDatabase.filter(item => item.lang === currentFilter);
      }
    }

    function shuffleList() {
      for (let i = filteredList.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [filteredList[i], filteredList[j]] = [filteredList[j], filteredList[i]];
      }
    }

    function setLanguageFilter(lang) {
      currentFilter = lang;
      document.getElementById('langFilterAll').className = lang === 'all' ? 'px-2 py-1 text-[10px] font-bold rounded bg-amber-500 text-slate-900 flex-1 text-center' : 'px-2 py-1 text-[10px] font-bold rounded bg-slate-700 hover:bg-slate-600 text-slate-300 flex-1 text-center';
      document.getElementById('langFilterPt').className = lang === 'pt' ? 'px-2 py-1 text-[10px] font-bold rounded bg-amber-500 text-slate-900 flex-1 text-center' : 'px-2 py-1 text-[10px] font-bold rounded bg-slate-700 hover:bg-slate-600 text-slate-300 flex-1 text-center';
      document.getElementById('langFilterEn').className = lang === 'en' ? 'px-2 py-1 text-[10px] font-bold rounded bg-amber-500 text-slate-900 flex-1 text-center' : 'px-2 py-1 text-[10px] font-bold rounded bg-slate-700 hover:bg-slate-600 text-slate-300 flex-1 text-center';
      document.getElementById('langFilterEs').className = lang === 'es' ? 'px-2 py-1 text-[10px] font-bold rounded bg-amber-500 text-slate-900 flex-1 text-center' : 'px-2 py-1 text-[10px] font-bold rounded bg-slate-700 hover:bg-slate-600 text-slate-300 flex-1 text-center';
      initGame();
    }

    function loadWord() {
      if (currentIndex >= filteredList.length) {
        alert("Parabéns! Você completou toda a lista do treino!");
        initGame();
        return;
      }

      const currentItem = filteredList[currentIndex];
      
      const badge = document.getElementById('wordLanguageBadge');
      if (currentItem.lang === 'pt') {
        badge.textContent = '🇧🇷 PORTUGUÊS';
        badge.className = 'px-2.5 py-0.5 rounded-full text-[10px] font-bold tracking-wider uppercase bg-emerald-500/20 text-emerald-400 border border-emerald-500/30';
      } else if (currentItem.lang === 'en') {
        badge.textContent = '🇬🇧 INGLÊS';
        badge.className = 'px-2.5 py-0.5 rounded-full text-[10px] font-bold tracking-wider uppercase bg-blue-500/20 text-blue-400 border border-blue-500/30';
      } else {
        badge.textContent = '🇪🇸 ESPANHOL';
        badge.className = 'px-2.5 py-0.5 rounded-full text-[10px] font-bold tracking-wider uppercase bg-red-500/20 text-red-400 border border-red-500/30';
      }

      document.getElementById('currentWordIndex').textContent = currentIndex + 1;
      document.getElementById('totalWordCount').textContent = filteredList.length;
      document.getElementById('spellingInput').value = '';
      lastRawInput = "";
      document.getElementById('infoDisplayBox').classList.add('hidden');

      setTimeout(() => speakWord(true), 400);
    }

    function getLangCode(lang) {
      if (lang === 'pt') return 'pt-BR';
      if (lang === 'en') return 'en-US';
      if (lang === 'es') return 'es-ES';
      return 'pt-BR';
    }

    function speakWord(twice = false) {
      if (!synth) return;
      synth.cancel();

      const item = filteredList[currentIndex];
      const utterance = new SpeechSynthesisUtterance(item.word);
      utterance.lang = getLangCode(item.lang);
      utterance.rate = 0.85;

      synth.speak(utterance);

      if (twice) {
        setTimeout(() => {
          const utterance2 = new SpeechSynthesisUtterance(item.word);
          utterance2.lang = getLangCode(item.lang);
          utterance2.rate = 0.85;
          synth.speak(utterance2);
        }, 1200);
      }
    }

    function speakLetter(letter) {
      if (!synth || !letter) return;
      synth.cancel();

      const item = filteredList[currentIndex];
      const utterance = new SpeechSynthesisUtterance(letter);
      utterance.lang = getLangCode(item.lang);
      utterance.rate = 0.9;
      synth.speak(utterance);
    }

    function toggleContextSentence() {
      const box = document.getElementById('infoDisplayBox');
      const text = document.getElementById('infoDisplayText');
      const item = filteredList[currentIndex];

      text.innerHTML = `<strong>Frase de Contexto:</strong> "${item.sentence}"`;
      box.classList.remove('hidden');

      const utterance = new SpeechSynthesisUtterance(item.sentence);
      utterance.lang = getLangCode(item.lang);
      synth.cancel();
      synth.speak(utterance);
    }

    function toggleDefinition() {
      const box = document.getElementById('infoDisplayBox');
      const text = document.getElementById('infoDisplayText');
      const item = filteredList[currentIndex];

      text.innerHTML = `<strong>Definição:</strong> ${item.def}`;
      box.classList.remove('hidden');
    }

    function cleanString(str) {
      return str.toUpperCase().replace(/[^A-ZÁÉÍÓÚÃÕÂÊÔÇÑ']/g, '');
    }

    function formatSpelling(str) {
      return cleanString(str).split('').join('-');
    }

    function submitSpelling() {
      const inputVal = document.getElementById('spellingInput').value;
      const currentItem = filteredList[currentIndex];
      
      const userClean = cleanString(inputVal);
      const targetClean = cleanString(currentItem.word);

      const modal = document.getElementById('feedbackModal');
      const icon = document.getElementById('feedbackIcon');
      const title = document.getElementById('feedbackTitle');
      msg = document.getElementById('feedbackMessage');
      const correctBox = document.getElementById('correctSpellingBox');

      correctBox.textContent = `${currentItem.word} ➔ ${formatSpelling(currentItem.word)}`;

      if (userClean === targetClean) {
        correctCount++;
        icon.innerHTML = '🎉';
        title.textContent = 'Soletração Correta!';
        title.className = 'text-lg font-bold mb-1 text-emerald-400';
        msg.textContent = 'Excelente! Você demonstrou domínio perfeito da palavra.';
      } else {
        incorrectCount++;
        icon.innerHTML = '❌';
        title.textContent = 'Soletração Incorreta';
        title.className = 'text-lg font-bold mb-1 text-rose-400';
        msg.textContent = `A banca informou que a resposta exata era:`;
      }

      updateScoreboard();
      modal.classList.remove('hidden');
    }

    function skipWord() {
      currentIndex++;
      loadWord();
    }

    function nextQuestion() {
      document.getElementById('feedbackModal').classList.add('hidden');
      currentIndex++;
      loadWord();
    }

    function updateScoreboard() {
      document.getElementById('scoreCorrect').textContent = correctCount;
      document.getElementById('scoreIncorrect').textContent = incorrectCount;
      document.getElementById('wordsRemaining').textContent = filteredList.length - currentIndex;
    }

    function handleKeyPress(e) {
      if (e.key === 'Enter') {
        submitSpelling();
      }
    }

    document.getElementById('spellingInput').addEventListener('input', function(e) {
      let raw = cleanString(e.target.value);
      
      if (raw.length > lastRawInput.length) {
        let addedChar = raw.charAt(raw.length - 1);
        speakLetter(addedChar);
      }

      lastRawInput = raw;

      if (raw.length > 0) {
        e.target.value = raw.split('').join('-');
      } else {
        e.target.value = '';
      }
    });

    window.onload = initGame;
  </script>
</body>
</html>
